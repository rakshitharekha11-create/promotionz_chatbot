<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Promotionz.AI Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Chatbot -->
    <div class="chatbot">

        <!-- Header -->
        <div class="chatbot-header">

            <div class="bot-info">

                <div class="bot-avatar">P</div>

                <div>
                    <h3>Promotionz.AI</h3>
                    <span>AI Assistant • Online</span>
                </div>

            </div>

            <button class="close-btn">×</button>

        </div>


        <!-- Chat Messages -->
        <div class="chatbot-body" id="chatBody">

            <div class="message bot-message">

                <p>
                    Hi! 👋 I'm the Promotionz.AI assistant.
                </p>

                <p>
                    How can I help you grow your business today?
                </p>

            </div>


            <!-- Quick Reply Buttons -->
            <div class="quick-replies">

                <button class="quick-btn">🌐 Website</button>

                <button class="quick-btn">🔍 SEO / AEO</button>

                <button class="quick-btn">📈 Lead Generation</button>

                <button class="quick-btn">📢 Paid Ads</button>

                <button class="quick-btn">💬 WhatsApp / CRM</button>

                <button class="quick-btn">🤖 AI Solutions</button>

                <button class="quick-btn">🎨 Branding</button>

                <button class="quick-btn">🆓 Free Website Audit</button>

                <button class="quick-btn">👤 Talk to Team</button>

            </div>

        </div>


        <!-- Input Area -->
        <div class="chatbot-input">

            <input
                type="text"
                id="userInput"
                placeholder="Type your message..."
            >

            <button id="sendButton">➤</button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
